    :root {
      --color-primary: #0A369D;
      --color-primary-light: #4D8BFF;
      --color-secondary: #1A9A8A;
      --color-secondary-hover: #0D6B5E;

      --color-accent-dark: #1A5F7A;
      --color-surface: #EAEBEB;
      --color-surface-variant: #8A8A93;
      --color-surface-variant-original: #95959D;
      --color-background: #141415;
      --color-on-primary: #EAEBEB;
      --color-on-secondary: #141415;
      --color-on-surface: #141415;
      --color-on-background: #EAEBEB;
      --color-disabled: #5A5A60;
      --color-placeholder: #A0A0A8;
      --color-gradient-start: #0A369D;
      --color-gradient-mid: #3BC1AE;
      --color-gradient-end: #73C2FB;

      --font-display: "Gill Sans Display", "Gill Sans", sans-serif;
      --font-secondary: "Oscine Trial", system-ui, sans-serif;
      --font-body: "Open Sauce Two", system-ui, sans-serif;

      --font-size-display: 72px;
      --font-size-h1: 48px;
      --font-size-h2: 40px;
      --font-size-h3: 24px;
      --font-size-body: 20px;
      --font-size-nav: 20px;
      --font-size-small: 16px;
      --font-size-button: 20px;
      --font-size-link: 20px;

      --font-weight-display: 700;
      --font-weight-h1: 700;
      --font-weight-h2: 700;
      --font-weight-h3: 400;
      --font-weight-body: 400;
      --font-weight-nav: 400;
      --font-weight-small: 400;
      --font-weight-button: 400;
      --font-weight-link: 400;

      --line-height-display: 1;
      --line-height-h1: 1;
      --line-height-h2: 1.05;
      --line-height-h3: 1.2;
      --line-height-body: 1.5;
      --line-height-nav: 1.5;
      --line-height-small: 1.5;
      --line-height-button: 1.5;
      --line-height-link: 1.5;

      --rounded-default: 0px;
      --rounded-buttons: 0px;
      --rounded-cards: 0px;
      --rounded-fields: 0px;
      --rounded-images: 0px;
      --rounded-containers: 0px;

      --spacing-max-width: 1440px;
      --spacing-grid-desktop: 14;
      --spacing-grid-tablet: 10;
      --spacing-grid-mobile: 6;

      --btn-primary-bg: var(--color-primary);
      --btn-primary-text: var(--color-on-primary);
      --btn-primary-hover-bg: var(--color-secondary-hover);
      --btn-primary-pressed-bg: var(--color-primary);
      --btn-primary-disabled-bg: var(--color-disabled);
      --btn-secondary-bg: var(--color-surface);
      --btn-secondary-text: var(--color-primary);
      --btn-secondary-hover-text: var(--color-secondary-hover);
      --btn-ghost-bg: var(--color-surface);
      --btn-ghost-text: var(--color-accent-dark);
      --btn-ghost-hover-text: var(--color-secondary-hover);
      --btn-padding: 12px 24px;
      --link-text: var(--color-accent);
      --link-hover-text: var(--color-secondary-original);

      --card-bg: var(--color-background);
      --card-text: var(--color-on-background);
      --card-padding: 24px;

      --hero-bg: var(--color-background);
      --hero-text: var(--color-on-background);
      --hero-padding: 80px 0;
      --hero-gradient-bg: var(--color-gradient-start);
      --hero-gradient-text: var(--color-on-primary);

      --nav-bg: var(--color-background);
      --nav-text: var(--color-on-background);
      --nav-link-text: var(--color-primary-light);
      --nav-link-hover-text: var(--color-secondary-original);
      --nav-padding: 16px 0;

      --field-bg: var(--color-background);
      --field-text: var(--color-on-background);
      --field-border: var(--color-surface-variant);
      --field-focus-border: var(--color-primary);
      --field-placeholder: var(--color-placeholder);
      --field-padding: 12px 16px;
      --field-label-padding: 0 0 4px;

      --icon-bg: var(--color-background);
      --icon-text: var(--color-surface);
      --icon-hover-bg: var(--color-surface);
      --icon-hover-text: var(--color-background);
      --icon-size: 24px;

      --tag-bg: var(--color-surface-variant);
      --tag-text: var(--color-on-surface);
      --tag-padding: 4px 8px;

      --decorative-bg: var(--color-background);
      --decorative-text: var(--color-surface-variant-original);
      --decorative-accent-bg: var(--color-secondary-original);
      --decorative-accent-text: var(--color-on-secondary);

      --gradient-mid-bg: var(--color-gradient-mid);
      --gradient-mid-text: var(--color-on-surface);
      --gradient-end-bg: var(--color-gradient-end);
      --gradient-end-text: var(--color-on-surface);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: var(--font-body);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-body);
      line-height: var(--line-height-body);
      color: var(--color-on-background);
      background-color: var(--color-background);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: 100%;
      max-width: var(--spacing-max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    @media (min-width: 1024px) {
      .container {
        padding: 0 48px;
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    a {
      color: var(--color-accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: var(--color-secondary-original);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ============ SECTIONS ============ */

    .section {
      padding: 64px 0;
    }

    .section__header {
      margin-bottom: 40px;
      text-align: center;
    }

    .section__title {
      font-family: var(--font-display);
      font-size: clamp(32px, 6vw, 48px);
      font-weight: var(--font-weight-display);
      line-height: var(--line-height-display);
      color: var(--color-primary);
      margin-bottom: 16px;
    }

    .section__description {
      font-size: var(--font-size-body);
      color: var(--color-surface-variant);
      max-width: 600px;
      margin: 0 auto;
    }

    /* ============ COLORS ============ */

    .color-section__title {
      font-family: var(--font-secondary);
      font-size: var(--font-size-h3);
      font-weight: var(--font-weight-h3);
      font-style: italic;
      color: var(--color-primary);
      margin-bottom: 24px;
    }

    .color-grid {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    @media (min-width: 768px) {
      .color-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .color-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .color-card {
      background: var(--color-background);
      border: 1px solid var(--color-surface-variant);
      border-radius: var(--rounded-default);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .color-card__swatch {
      width: 48px;
      height: 48px;
      border-radius: var(--rounded-default);
    }

    .color-card__info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .color-card__name {
      font-family: var(--font-secondary);
      font-size: var(--font-size-small);
      font-weight: var(--font-weight-small);
      color: var(--color-on-surface);
    }

    .color-card__token {
      font-family: var(--font-body);
      font-size: var(--font-size-small);
      color: var(--color-on-surface);
    }

    .color-card__hex {
      font-family: var(--font-body);
      font-size: var(--font-size-small);
      color: var(--color-primary);
      word-break: break-all;
    }

    .color-card__role {
      font-size: var(--font-size-small);
      color: var(--color-surface-variant);
    }

    .color-card__contrast {
      font-family: var(--font-body);
      font-size: var(--font-size-small);
      opacity: 0.8;
    }

    .color-card__warning {
      color: #ff6b6b;
      font-family: var(--font-body);
      font-size: var(--font-size-small);
    }

    /* ============ GRADIENTS ============ */

    .gradient-showcase {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    @media (min-width: 768px) {
      .gradient-showcase {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .gradient-item {
      background: var(--color-background);
      border: 1px solid var(--color-surface-variant);
      border-radius: var(--rounded-default);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gradient-item__bar {
      height: 32px;
      border-radius: var(--rounded-default);
    }

    .gradient-item__info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .gradient-full {
      background: var(--color-background);
